<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Conceal wallet recovery flow</title>
  <desc id="desc">Recovery information is entered locally, wallet keys are derived, the chain is scanned, and the wallet balance and history are restored.</desc>
  <rect width="1200" height="520" rx="24" fill="#0a0a0a"/>
  <path d="M238 250h92m218 0h92m218 0h92" stroke="#ffa500" stroke-width="4" stroke-linecap="round"/>
  <path d="m318 238 14 12-14 12m310-24 14 12-14 12m310-24 14 12-14 12" fill="none" stroke="#ffa500" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Poppins,Arial,sans-serif">
    <g transform="translate(40 170)">
      <rect width="198" height="160" rx="16" fill="#151515" stroke="#555"/>
      <circle cx="32" cy="34" r="8" fill="#ffa500"/>
      <text x="24" y="80" fill="#fff" font-size="24" font-weight="600">Recovery material</text>
      <text x="24" y="111" fill="#b0b0b0" font-size="17">Entered only into the</text>
      <text x="24" y="136" fill="#b0b0b0" font-size="17">verified wallet</text>
    </g>
    <g transform="translate(350 170)">
      <rect width="198" height="160" rx="16" fill="#151515" stroke="#555"/>
      <circle cx="32" cy="34" r="8" fill="#ffa500"/>
      <text x="24" y="80" fill="#fff" font-size="24" font-weight="600">Derive keys</text>
      <text x="24" y="111" fill="#b0b0b0" font-size="17">The operation stays</text>
      <text x="24" y="136" fill="#b0b0b0" font-size="17">on your device</text>
    </g>
    <g transform="translate(660 170)">
      <rect width="198" height="160" rx="16" fill="#151515" stroke="#555"/>
      <circle cx="32" cy="34" r="8" fill="#ffa500"/>
      <text x="24" y="80" fill="#fff" font-size="24" font-weight="600">Scan the chain</text>
      <text x="24" y="111" fill="#b0b0b0" font-size="17">Find transactions for</text>
      <text x="24" y="136" fill="#b0b0b0" font-size="17">the restored wallet</text>
    </g>
    <g transform="translate(970 170)">
      <rect width="190" height="160" rx="16" fill="#151515" stroke="#555"/>
      <circle cx="32" cy="34" r="8" fill="#ffa500"/>
      <text x="24" y="80" fill="#fff" font-size="24" font-weight="600">Verify</text>
      <text x="24" y="111" fill="#b0b0b0" font-size="17">Check the address,</text>
      <text x="24" y="136" fill="#b0b0b0" font-size="17">balance and history</text>
    </g>
    <text x="40" y="72" fill="#fff" font-size="32" font-weight="600">Wallet recovery happens locally</text>
    <text x="40" y="108" fill="#b0b0b0" font-size="19">Support can help with the process, but never needs the material that controls the wallet.</text>
    <text x="40" y="425" fill="#ffa500" font-size="18" font-weight="600">KEEP PRIVATE</text>
    <text x="190" y="425" fill="#b0b0b0" font-size="18">Mnemonic phrase · private spend key · wallet password · unredacted backup</text>
  </g>
</svg>
