<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Conceal transaction lifecycle</title>
  <desc id="desc">Five connected stages show a wallet constructing a transaction, signing it locally, broadcasting to a node, waiting in the mempool, and being included in a block followed by confirmations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#19130a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa500"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1400" height="520" rx="32" fill="url(#bg)"/>
  <text x="70" y="74" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">From wallet intent to network confirmation</text>
  <text x="70" y="112" fill="#b8b8b8" font-family="Arial, sans-serif" font-size="18">Keys remain in the wallet. The node receives a signed transaction.</text>
  <g fill="none" stroke="#ffa500" stroke-width="5" marker-end="url(#arrow)">
    <path d="M298 275 H350"/>
    <path d="M558 275 H610"/>
    <path d="M818 275 H870"/>
    <path d="M1078 275 H1130"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 175)">
      <rect width="228" height="200" rx="22" fill="#242424" stroke="#4a4a4a"/>
      <circle cx="38" cy="38" r="20" fill="#ffa500"/>
      <text x="38" y="45" text-anchor="middle" fill="#111" font-size="19" font-weight="700">1</text>
      <text x="24" y="92" fill="#fff" font-size="23" font-weight="700">Construct</text>
      <text x="24" y="126" fill="#c9c9c9" font-size="17">Destination, amount</text>
      <text x="24" y="151" fill="#c9c9c9" font-size="17">and fee are reviewed</text>
    </g>
    <g transform="translate(330 175)">
      <rect width="228" height="200" rx="22" fill="#242424" stroke="#ffa500" stroke-width="2"/>
      <circle cx="38" cy="38" r="20" fill="#ffa500"/>
      <text x="38" y="45" text-anchor="middle" fill="#111" font-size="19" font-weight="700">2</text>
      <text x="24" y="92" fill="#fff" font-size="23" font-weight="700">Sign locally</text>
      <text x="24" y="126" fill="#c9c9c9" font-size="17">Private keys stay</text>
      <text x="24" y="151" fill="#c9c9c9" font-size="17">inside the wallet</text>
    </g>
    <g transform="translate(590 175)">
      <rect width="228" height="200" rx="22" fill="#242424" stroke="#4a4a4a"/>
      <circle cx="38" cy="38" r="20" fill="#ffa500"/>
      <text x="38" y="45" text-anchor="middle" fill="#111" font-size="19" font-weight="700">3</text>
      <text x="24" y="92" fill="#fff" font-size="23" font-weight="700">Broadcast</text>
      <text x="24" y="126" fill="#c9c9c9" font-size="17">A node validates</text>
      <text x="24" y="151" fill="#c9c9c9" font-size="17">and relays it</text>
    </g>
    <g transform="translate(850 175)">
      <rect width="228" height="200" rx="22" fill="#242424" stroke="#4a4a4a"/>
      <circle cx="38" cy="38" r="20" fill="#ffa500"/>
      <text x="38" y="45" text-anchor="middle" fill="#111" font-size="19" font-weight="700">4</text>
      <text x="24" y="92" fill="#fff" font-size="23" font-weight="700">Mempool</text>
      <text x="24" y="126" fill="#c9c9c9" font-size="17">Pending inclusion</text>
      <text x="24" y="151" fill="#c9c9c9" font-size="17">in a mined block</text>
    </g>
    <g transform="translate(1110 175)">
      <rect width="220" height="200" rx="22" fill="#242424" stroke="#4a4a4a"/>
      <circle cx="38" cy="38" r="20" fill="#ffa500"/>
      <text x="38" y="45" text-anchor="middle" fill="#111" font-size="19" font-weight="700">5</text>
      <text x="24" y="92" fill="#fff" font-size="23" font-weight="700">Confirm</text>
      <text x="24" y="126" fill="#c9c9c9" font-size="17">Included in a block;</text>
      <text x="24" y="151" fill="#c9c9c9" font-size="17">later blocks add depth</text>
    </g>
  </g>
  <rect x="70" y="421" width="1260" height="46" rx="16" fill="#ffa500" fill-opacity=".1" stroke="#ffa500" stroke-opacity=".45"/>
  <text x="700" y="451" text-anchor="middle" fill="#ffd18a" font-family="Arial, sans-serif" font-size="18">Submitted does not mean confirmed. Keep the transaction hash and verify network inclusion.</text>
</svg>
