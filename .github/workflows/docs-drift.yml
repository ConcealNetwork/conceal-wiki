name: Check documentation release drift

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-release-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-release-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check official release tags
        run: node scripts/check-doc-release-drift.mjs > drift.md
      - name: Create or update documentation-drift issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34 # v8.0.0
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('drift.md', 'utf8');
            if (!body.trim()) {
              core.notice('Documented releases match official latest tags.');
              return;
            }
            const { createOrUpdateDocumentationDriftIssue } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/check-doc-release-drift.mjs`,
            );
            await createOrUpdateDocumentationDriftIssue(github, context.repo, body);
